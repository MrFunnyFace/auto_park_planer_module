services:
  postgres:
    image: postgres:17.4
    container_name: a_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./DB/PostgresSQL:/var/lib/postgresql/data
      - ./DB/BACK_UP:/backup
      - ./DB/INIT_POSTGRES:/docker-entrypoint-initdb.d
    networks:
      - autopark_network

  php-fpm:
    build: ./backend
    container_name: a_php
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend  
    networks:
      - autopark_network
    depends_on:
      - postgres

  nginx:
    image: nginx:1.25
    container_name: a_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./frontend:/var/www/frontend:ro  # Добавьте эту строку
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php-fpm
    networks:
      - autopark_network

networks:
  autopark_network:
    driver: bridge

volumes:
  postgres_data:

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления автопарком</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/main_page.css">
</head>
<body>
    <div class="main-container">
        <div class="welcome-section">
            <h1>🚛 Добро пожаловать в систему управления автопарком</h1>
            <p>Система для эффективного управления логистическими процессами</p>
            
            <div class="auth-links">
                <a href="pages/auth/index.html" class="auth-button">Войти в систему</a>
            </div>
        </div>
        
        <div class="system-status">
            <h3>Статус системы</h3>
            <div class="status-grid">
                <div class="status-item">
                    <span class="status status-online">База данных</span>
                    <span>Подключена</span>
                </div>
                <div class="status-item">
                    <span class="status status-online">API</span>
                    <span>Работает</span>
                </div>
                <div class="status-item">
                    <span class="status status-online">Система</span>
                    <span>Активна</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

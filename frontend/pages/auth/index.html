<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">🚛</div>
            <div class="auth-title">Автопарк</div>
            <div class="auth-subtitle">Единая логистическая платформа</div>
        </div>

        <form class="auth-form" id="authForm">
            <div id="alertContainer"></div>
            <div class="form-group">
                <label for="username" class="form-label">Email</label>
                <input type="email" id="username" name="username" class="form-input" placeholder="Введите email" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Введите пароль" required>
            </div>

            <div class="form-checkbox">
                <input type="checkbox" id="remember" name="remember" class="checkbox">
                <label for="remember" class="checkbox-label">Запомнить меня</label>
            </div>

            <button type="submit" class="auth-button">Войти в систему</button>

            <div class="forgot-password">
                <a href="#forgot">Забыли пароль?</a>
            </div>
        </form>

        <div class="system-info">
            <h4>Информация о системе</h4>
            <p>Версия: 1.0.0</p>
            <p>Последнее обновление: 2025</p>
        </div>
    </div>

    <script src="../../assets/js/modules/auth.js"></script>
</body>
</html>

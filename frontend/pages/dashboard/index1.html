    <!-- Loading State -->
    <div id="loading-state" style="display: none;">
        <!-- Ваш существующий код загрузки -->

    <!-- Dashboard Content -->
    <div class="dashboard-content">
        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <h3>Автомобили</h3>
                </div>
                <div class="card-body">
                    <!-- Содержимое будет заполнено JS -->
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Водители</h3>
                </div>
                <div class="card-body">
                    <!-- Содержимое будет заполнено JS -->
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Заказы</h3>
                </div>
                <div class="card-body">
                    <!-- Содержимое будет заполнено JS -->
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Расходы</h3>

                <div class="card-body">
                    <!-- Содержимое будет заполнено JS -->

        <!-- Карточка активности -->
        <div class="card">
            <div class="card-header">
                <h3>Последние события</h3>
            </div>
            <div class="card-body">
                <!-- Содержимое будет заполнено JS -->
            </div>
        </div>
    </div>

    <!-- Подключение скрипта -->
    

        <!-- Scripts -->
    <script src="../../assets/js/modules/dashboard.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/navigation.js"></script>


    <script>
        Navigation.createNavigation('navigation-container');
        Navigation.displayUserInfo();
        // Расширенная инициализация
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Инициализация расширенной панели управления...');
            
            // Инициализируем фильтры активности
            initActivityFilters();
            
            // Инициализируем Dashboard
            if (typeof Dashboard !== 'undefined') {
                if (!window.dashboard) {
                    window.dashboard = new Dashboard();
                }
            } else {
                console.error('Dashboard class не найден');
                showErrorMessage('Ошибка загрузки системы управления');
            }
        });
        
        // Фильтры для активности
        function initActivityFilters() {
            const filters = document.querySelectorAll('.activity-filter');
            filters.forEach(filter => {
                filter.addEventListener('click', function() {
                    // Убираем активный класс у всех
                    filters.forEach(f => f.classList.remove('active'));
                    // Добавляем активный класс к текущему
                    this.classList.add('active');
                    
                    // Фильтруем активность
                    const filterType = this.dataset.filter;
                    filterActivity(filterType);
                });
            });
        }
        
        // Фильтрация активности
        function filterActivity(type) {
            const activities = document.querySelectorAll('.activity-item');
            activities.forEach(activity => {
                if (type === 'all') {
                    activity.style.display = 'flex';
                } else {
                    const activityType = activity.dataset.type;
                    activity.style.display = activityType === type ? 'flex' : 'none';
                }
            });
        }
        

        
        // Показать сообщение об ошибке
        function showErrorMessage(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'data-error';
            errorDiv.textContent = message;
            errorDiv.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 10000;
                max-width: 400px;
                padding: 2rem;
            `;
            
            document.body.appendChild(errorDiv);
            
            // Убираем через 5 секунд
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }
        
        // Обработка ошибок JavaScript
        window.addEventListener('error', function(e) {
            console.error('JavaScript Error:', e.error);
            if (e.error && e.error.message) {
                showErrorMessage('Произошла ошибка: ' + e.error.message);
            }
        });
        
        // Обработка необработанных промисов
        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled Promise Rejection:', e.reason);
            showErrorMessage('Ошибка загрузки данных. Попробуйте обновить страницу.');
        });
    </script>
</body>
</html>
